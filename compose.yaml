services:
  token2wav:
    image: "${LYCHEE_FD_IMAGE:-ghcr.io/hitsz-tmg/lychee-fd:latest}"
    runtime: nvidia
    entrypoint: ["/app/scripts/start_token2wav_server.sh"]
    ports:
      - "${LYCHEEFD_T2W_SERVER_PORT:-8091}:8091"
    volumes:
      - "${HOST_MODEL_ROOT:-./models}:${CONTAINER_MODEL_ROOT:-/models}:ro"
      - "./runtime_logs:/app/runtime_logs"
    environment:
      NVIDIA_VISIBLE_DEVICES: "${TOKEN2WAV_NVIDIA_VISIBLE_DEVICES:-all}"
      CUDA_VISIBLE_DEVICES: "${TOKEN2WAV_CUDA_VISIBLE_DEVICES:-0}"
      NUMBA_CACHE_DIR: "/tmp/stepaudio_numba_cache"
      MPLCONFIGDIR: "/tmp/matplotlib-cache"
      STEPAUDIO2_SOURCE_DIR: "/app/third_party/Step-Audio2"
      LYCHEEFD_T2W_SERVER_HOST: "0.0.0.0"
      LYCHEEFD_T2W_SERVER_PORT: "8091"
      LYCHEEFD_T2W_MODEL_PATH: "${LYCHEEFD_T2W_MODEL_PATH:-/models/token2wav}"

  frontend:
    image: "${LYCHEE_FD_IMAGE:-ghcr.io/hitsz-tmg/lychee-fd:latest}"
    runtime: nvidia
    depends_on:
      - token2wav
    entrypoint: ["/app/scripts/start_frontend_dev.sh"]
    command: ["prod", "public"]
    ports:
      - "${FRONTEND_PORT:-8084}:8084"
      - "${LYCHEEFD_SERVER_PORT:-7860}:7860"
    volumes:
      - "${HOST_MODEL_ROOT:-./models}:${CONTAINER_MODEL_ROOT:-/models}:ro"
      - "${PRESETS_FILE_HOST:-./model_presets_dev.json}:/app/model_presets_dev.json:ro"
      - "./runtime_logs:/app/runtime_logs"
      - "./realtime_aligned_audio:/app/realtime_aligned_audio"
    environment:
      NVIDIA_VISIBLE_DEVICES: "${BACKEND_NVIDIA_VISIBLE_DEVICES:-all}"
      CUDA_VISIBLE_DEVICES: "${BACKEND_CUDA_VISIBLE_DEVICES:-1}"
      ALLOWED_MODEL_ROOT: "${ALLOWED_MODEL_ROOT:-/models}"
      AUTO_LOAD_DEFAULT: "${AUTO_LOAD_DEFAULT:-0}"
      BACKEND_HEALTH_URL: "http://127.0.0.1:7860"
      FRONTEND_HOST: "0.0.0.0"
      FRONTEND_PORT: "8084"
      LYCHEEFD_CONDA_ENV_PATH: "/opt/conda/envs/fdmodel-demo"
      STEPAUDIO2_SOURCE_DIR: "/app/third_party/Step-Audio2"
      LYCHEEFD_SERVER_NAME: "0.0.0.0"
      LYCHEEFD_SERVER_PORT: "7860"
      LYCHEEFD_MODEL_PATH: "${LYCHEEFD_MODEL_PATH:-/models/lychee_full_duplex_v1.5}"
      LYCHEEFD_VLLM_SOURCE_DIR: "/app/third_party/vllm"
      LYCHEEFD_VLLM_SYNC_FLASH_ATTN: "1"
      LYCHEEFD_VLLM_FORCE_SYNC_FLASH_ATTN: "1"
      LYCHEEFD_USE_VLLM: "${LYCHEEFD_USE_VLLM:-1}"
      LYCHEEFD_BACKEND: "${LYCHEEFD_BACKEND:-vllm}"
      LYCHEEFD_REALTIME_STRICT_INFER_WINDOW: "${LYCHEEFD_REALTIME_STRICT_INFER_WINDOW:-1}"
      LYCHEEFD_REALTIME_INFER_WINDOW_MS: "${LYCHEEFD_REALTIME_INFER_WINDOW_MS:-400}"
      LYCHEEFD_REALTIME_INFER_WINDOW_MIN_MS: "${LYCHEEFD_REALTIME_INFER_WINDOW_MIN_MS:-200}"
      LYCHEEFD_WINDOW_SECOND: "${LYCHEEFD_WINDOW_SECOND:-0.4}"
      LYCHEEFD_STOKEN_DELAY_NUM: "${LYCHEEFD_STOKEN_DELAY_NUM:-10}"
      LYCHEEFD_TTS_VOCODER_HOP_SIZE: "${LYCHEEFD_TTS_VOCODER_HOP_SIZE:-10}"
      LYCHEEFD_T2W_STREAM_LOOKAHEAD_LEN: "${LYCHEEFD_T2W_STREAM_LOOKAHEAD_LEN:-3}"
      LYCHEEFD_T2W_REMOTE_ENABLED: "${LYCHEEFD_T2W_REMOTE_ENABLED:-1}"
      LYCHEEFD_T2W_REMOTE_URL: "${LYCHEEFD_T2W_REMOTE_URL:-http://token2wav:8091}"
      LYCHEEFD_T2W_REMOTE_FALLBACK: "${LYCHEEFD_T2W_REMOTE_FALLBACK:-0}"
      LYCHEEFD_VLLM_MAX_MODEL_LEN: "${LYCHEEFD_VLLM_MAX_MODEL_LEN:-16384}"
      LYCHEEFD_VLLM_GPU_MEMORY_UTILIZATION: "${LYCHEEFD_VLLM_GPU_MEMORY_UTILIZATION:-0.90}"
      LYCHEEFD_VLLM_SIDE_PARALLEL_BRANCH: "${LYCHEEFD_VLLM_SIDE_PARALLEL_BRANCH:-0}"
      LYCHEEFD_CUDA_EMPTY_CACHE_ON_SESSION_CLOSE: "${LYCHEEFD_CUDA_EMPTY_CACHE_ON_SESSION_CLOSE:-0}"
      LYCHEEFD_REALTIME_DEBUG: "${LYCHEEFD_REALTIME_DEBUG:-0}"
      VUE_APP_REALTIME_DEBUG: "${VUE_APP_REALTIME_DEBUG:-0}"

  backend:
    image: "${LYCHEE_FD_IMAGE:-ghcr.io/hitsz-tmg/lychee-fd:latest}"
    runtime: nvidia
    profiles: ["direct-backend"]
    depends_on:
      - token2wav
    entrypoint: ["/app/scripts/start_backend.sh"]
    command: ["stable", "${LYCHEEFD_BACKEND:-vllm}"]
    ports:
      - "${LYCHEEFD_SERVER_PORT:-7860}:7860"
    volumes:
      - "${HOST_MODEL_ROOT:-./models}:${CONTAINER_MODEL_ROOT:-/models}:ro"
      - "./runtime_logs:/app/runtime_logs"
      - "./realtime_aligned_audio:/app/realtime_aligned_audio"
    environment:
      NVIDIA_VISIBLE_DEVICES: "${BACKEND_NVIDIA_VISIBLE_DEVICES:-all}"
      CUDA_VISIBLE_DEVICES: "${BACKEND_CUDA_VISIBLE_DEVICES:-1}"
      LYCHEEFD_CONDA_ENV_PATH: "/opt/conda/envs/fdmodel-demo"
      STEPAUDIO2_SOURCE_DIR: "/app/third_party/Step-Audio2"
      LYCHEEFD_SERVER_NAME: "0.0.0.0"
      LYCHEEFD_SERVER_PORT: "7860"
      LYCHEEFD_MODEL_PATH: "${LYCHEEFD_MODEL_PATH:-/models/lychee_full_duplex_v1.5}"
      LYCHEEFD_VLLM_SOURCE_DIR: "/app/third_party/vllm"
      LYCHEEFD_VLLM_SYNC_FLASH_ATTN: "1"
      LYCHEEFD_VLLM_FORCE_SYNC_FLASH_ATTN: "1"
      LYCHEEFD_USE_VLLM: "${LYCHEEFD_USE_VLLM:-1}"
      LYCHEEFD_BACKEND: "${LYCHEEFD_BACKEND:-vllm}"
      LYCHEEFD_T2W_REMOTE_ENABLED: "${LYCHEEFD_T2W_REMOTE_ENABLED:-1}"
      LYCHEEFD_T2W_REMOTE_URL: "${LYCHEEFD_T2W_REMOTE_URL:-http://token2wav:8091}"
      LYCHEEFD_T2W_REMOTE_FALLBACK: "${LYCHEEFD_T2W_REMOTE_FALLBACK:-0}"
      LYCHEEFD_REALTIME_STRICT_INFER_WINDOW: "${LYCHEEFD_REALTIME_STRICT_INFER_WINDOW:-1}"
      LYCHEEFD_REALTIME_INFER_WINDOW_MS: "${LYCHEEFD_REALTIME_INFER_WINDOW_MS:-400}"
      LYCHEEFD_REALTIME_INFER_WINDOW_MIN_MS: "${LYCHEEFD_REALTIME_INFER_WINDOW_MIN_MS:-200}"
      LYCHEEFD_WINDOW_SECOND: "${LYCHEEFD_WINDOW_SECOND:-0.4}"
      LYCHEEFD_STOKEN_DELAY_NUM: "${LYCHEEFD_STOKEN_DELAY_NUM:-10}"
      LYCHEEFD_TTS_VOCODER_HOP_SIZE: "${LYCHEEFD_TTS_VOCODER_HOP_SIZE:-10}"
      LYCHEEFD_T2W_STREAM_LOOKAHEAD_LEN: "${LYCHEEFD_T2W_STREAM_LOOKAHEAD_LEN:-3}"
      LYCHEEFD_VLLM_MAX_MODEL_LEN: "${LYCHEEFD_VLLM_MAX_MODEL_LEN:-16384}"
      LYCHEEFD_VLLM_GPU_MEMORY_UTILIZATION: "${LYCHEEFD_VLLM_GPU_MEMORY_UTILIZATION:-0.90}"
      LYCHEEFD_VLLM_SIDE_PARALLEL_BRANCH: "${LYCHEEFD_VLLM_SIDE_PARALLEL_BRANCH:-0}"
      LYCHEEFD_CUDA_EMPTY_CACHE_ON_SESSION_CLOSE: "${LYCHEEFD_CUDA_EMPTY_CACHE_ON_SESSION_CLOSE:-0}"
      LYCHEEFD_REALTIME_DEBUG: "${LYCHEEFD_REALTIME_DEBUG:-0}"
